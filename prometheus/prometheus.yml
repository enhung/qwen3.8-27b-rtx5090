# Prometheus configuration (mounted into the `prometheus` service).
#
# Both targets are scraped directly on the docker network — no auth needed
# there: vllm:8000 (engine + request metrics) and dcgm-exporter:9400
# (per-GPU: utilization, memory, power, temps). The authenticated public
# face is the caddy gateway on port 8030, which routes /metrics and
# /dcgm/metrics behind HTTP Basic auth (METRICS_USER / METRICS_HASH from
# .env) and /v1/* behind Basic auth or the plain vLLM bearer key (the same
# credential 8020 already requires); the vLLM API is also reachable
# directly on 8020 (bearer key or open). Block 8020/8030 at the firewall
# if you want no external exposure at all.
#
# The Prometheus UI is bound to 127.0.0.1:9090 only (see docker-compose.yml).
# Access it locally or via SSH tunnel.

global:
  # 5 s scrape for fine-grained GPU telemetry. With the 365 d retention
  # (docker-compose.yml), that's ~17k samples/day/series, so the
  # prometheus_data volume grows by several GB per year — keep it on a
  # disk with room to spare.
  scrape_interval: 5s
  evaluation_interval: 30s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

  - job_name: vllm
    metrics_path: /metrics
    static_configs:
      - targets:
          - vllm:8000
        labels:
          model: qwen3.8-27b

  # Per-GPU metrics (DCGM: utilization, memory, power, temps).
  - job_name: dcgm
    metrics_path: /metrics
    static_configs:
      - targets:
          - dcgm-exporter:9400
